<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tournoi Manager</title>
<meta name="description" content="Gestion de tournois de sports collectifs pour l'organisateur">
<meta name="theme-color" content="#1f4fd1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tournoi">
<style>
:root{
  --bg:#f3f5f9; --panel:#fff; --text:#1b2330; --muted:#677489; --line:#e2e7ef; --chip:#edf1f7;
  --accent:#2463eb; --accent-2:#1b4fc4; --accent-soft:#e6eeff; --ok:#15803d; --ok-soft:#e3f6ea;
  --warn:#b45309; --warn-soft:#fff4e0; --danger:#c62828; --danger-soft:#fdeaea; --r:10px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e131a; --panel:#161d27; --text:#e5eaf2; --muted:#93a0b5; --line:#283241; --chip:#202a38;
    --accent:#5b8fff; --accent-2:#477df5; --accent-soft:#1d2a45; --ok:#4ade80; --ok-soft:#14301f;
    --warn:#fbbf24; --warn-soft:#3a2d10; --danger:#f87171; --danger-soft:#3b1717; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
.mrow,.pm,.bm,.tabs button,.subtabs button,.wstep,.tpl{touch-action:manipulation}
select{max-width:100%;text-overflow:ellipsis}
.card,.grid2>*,.field{min-width:0}
.field>select,.field>input:not([type=checkbox]):not([type=color]){width:100%}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent);vertical-align:middle;margin:0 6px 0 0}
input[type=color]{padding:2px;width:38px;height:34px}
input[type=number]{width:90px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent-2)}
button.danger{color:var(--danger)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--chip)}
button.sm{padding:3px 8px;font-size:13px}
button.icon{padding:3px 7px;min-width:30px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.spacer{flex:1}
h1,h2,h3,h4{margin:0;line-height:1.25}
h2{font-size:19px;margin-bottom:12px}
h3{font-size:16px;margin-bottom:10px}
#app{max-width:1200px;margin:0 auto;padding:0 16px 60px}

/* header & tabs */
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.top .ttl{flex:1;min-width:200px}
.top h1{font-size:21px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;position:sticky;top:0;z-index:6;background:var(--bg)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subtabs button{border-radius:20px;background:var(--chip);border-color:transparent}
.subtabs button.on{background:var(--accent);color:#fff}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.grid2>.card{margin-bottom:0}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span{font-size:13px;color:var(--muted);font-weight:600}
.fields{display:flex;gap:14px;flex-wrap:wrap}
.fields .field{min-width:130px}
.check{display:flex;align-items:center;margin:6px 0 10px;cursor:pointer}
.note{background:var(--accent-soft);border-radius:8px;padding:9px 12px;font-size:13.5px;margin:8px 0}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.err{background:var(--danger-soft);color:var(--danger)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.act{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}

/* home */
.hero{padding:34px 0 20px}
.hero h1{font-size:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:52px;height:52px;border-radius:12px;box-shadow:0 4px 12px rgba(31,79,209,.3)}
.home-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 8px}
.logo-sm{width:30px;height:30px;border-radius:7px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:18px}
.tcard{cursor:pointer}
.tcard:hover{border-color:var(--accent)}
.tcard h3{margin-bottom:4px}

/* teams */
.team-row{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.team-row .seed{width:30px;text-align:right;color:var(--muted);font-weight:600}
.team-row input[type=text]{flex:1}
.tm{display:inline-flex;align-items:center;gap:6px;min-width:0}
.tm i{width:10px;height:10px;border-radius:50%;flex:none}
.tm.ph{color:var(--muted);font-style:italic}

/* phases */
.phase-card{border-left:4px solid var(--accent)}
.phase-card.pbracket{border-left-color:#9333ea}
.phase-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.phase-head input.pname{font-weight:700;font-size:16px;flex:1;min-width:160px}
.tab-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--chip);padding:10px;border-radius:8px;margin-bottom:8px}
.tab-row .field{margin:0}
.tb-list .tb{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel)}
.tb-list .tb b{width:22px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* navigation : sections, bandeau « À faire », assistant, barre des phases */
.tabs button i{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--chip);color:var(--muted);font-style:normal;font-size:12px;align-items:center;justify-content:center;margin-right:7px;vertical-align:-4px}
.tabs button.on i{background:var(--accent);color:#fff}
.next{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;margin:-6px 0 16px}
.next .lab{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.next.ok{background:var(--ok-soft)}
.next.ok .lab{font-size:16px}
.wz-wrap{position:sticky;top:var(--tabs-h,46px);z-index:5;background:var(--bg);margin-bottom:14px;display:flex;align-items:center;border-bottom:1px solid transparent}
.wz-wrap.stuck{border-bottom-color:var(--line);box-shadow:0 6px 8px -8px rgba(16,24,40,.25)}
.wizard{display:flex;gap:4px;overflow-x:auto;padding:6px 0;scrollbar-width:none;flex:1;min-width:0;scroll-behavior:smooth}
.wizard::-webkit-scrollbar{display:none}
.wz-arrow{flex:none;width:32px;height:32px;padding:0;border-radius:50%;font-size:18px;font-weight:700;line-height:1;color:var(--accent);background:var(--panel);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;visibility:hidden}
.wz-wrap.can-l .wz-arrow.l,.wz-wrap.can-r .wz-arrow.r{visibility:visible}
@media (min-width:701px){.wz-arrow{display:none}}
.wstep{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:6px 10px 6px 6px;border-radius:20px;color:var(--muted);white-space:nowrap;font-weight:600}
.wstep i{width:26px;height:26px;border-radius:50%;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;flex:none}
.wstep.seen i{background:var(--ok-soft);color:var(--ok)}
.wstep.on{background:var(--accent-soft);color:var(--accent)}
.wstep.on i{background:var(--accent);color:#fff}
.step-title{margin-bottom:12px}
.step-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 24px;padding-top:14px;border-top:1px solid var(--line)}
.recap{margin-top:4px}
.recap td{text-align:left;padding:4px 6px;border:0;vertical-align:top}
.recap td:first-child{width:38%}
.recap-ol{margin:4px 0 0;padding-left:20px;line-height:1.7}
.launch{text-align:center;padding:24px 16px}
.launch h3{font-size:19px}
button.big{font-size:17px;padding:12px 26px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tpl{border:2px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.tpl.on{border-color:var(--accent);background:var(--accent-soft)}
.tpl.pick{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.tpl.pick:hover,.tpl.pick:focus-visible{border-color:var(--accent);box-shadow:0 2px 10px rgba(36,99,235,.15);outline:none}
.tpl-go{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.tpl-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.tpl-s{font-size:13px;font-weight:600;color:var(--accent)}
.tpl p{margin:2px 0 6px;flex:1}
.selor{display:flex;gap:6px;align-items:center}
.selor select{flex:1;min-width:90px}
.selor input{width:80px}
.modal.wide{max-width:1080px}
.gen-grid{display:grid;grid-template-columns:minmax(230px,1fr) 2fr;gap:14px;margin:10px 0}
.gen-grid .phase-card{margin:0}
.gen-in td{padding:3px 6px}
.phasebar{padding:12px 14px}
.pchips{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pchip{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 7px;border-radius:9px;background:var(--chip);white-space:nowrap;border:2px solid transparent}
.pchip i{width:24px;height:24px;border-radius:50%;background:var(--panel);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:13px;color:var(--muted)}
.pchip div{display:flex;flex-direction:column;line-height:1.2}
.pchip span{font-size:12px;color:var(--muted)}
.pchip.ok i{background:var(--ok);color:#fff}
.pchip.act{border-color:var(--accent);background:var(--accent-soft)}
.pchip.act i{background:var(--accent);color:#fff}
.pchip.todo{opacity:.7}
.parrow{color:var(--muted);flex:none}
.pacts{margin-top:10px}

/* matches */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.slot-h{font-size:14px;font-weight:700;color:var(--muted);margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.slot-h::after{content:"";flex:1;height:1px;background:var(--line)}
.mrow{display:grid;grid-template-columns:110px minmax(120px,1fr) minmax(300px,2.2fr) 150px;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;margin-bottom:6px;cursor:pointer}
.mrow:hover{border-color:var(--accent)}
.mrow.done{background:color-mix(in srgb,var(--panel) 75%,var(--chip))}
.mmeta{font-size:13px;color:var(--muted)}
.mmeta b{color:var(--text)}
.mlabel{font-size:13px;color:var(--muted)}
.mteams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.mteams .ta{justify-self:end;text-align:right}
.mteams .win{font-weight:700}
.msc{text-align:center;min-width:64px}
.msc .sc{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.msc small{display:block;color:var(--muted);font-size:11.5px}
.mref{font-size:12.5px;color:var(--muted);text-align:right}
@media (max-width:820px){
  .mrow{grid-template-columns:1fr;gap:4px}
  .mref{text-align:left}
}

/* tables */
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
td.l,th.l{text-align:left}
td.rk{font-weight:700;width:36px}
td.pts{font-weight:700}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px}
.tables .card{margin:0;overflow-x:auto}
details>summary{cursor:pointer;font-weight:600;padding:6px 0}

/* bracket */
.bracket{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.bcol{min-width:230px;display:flex;flex-direction:column;gap:10px}
.bcol h4{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
.bm{background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;overflow:hidden}
.bm:hover{border-color:var(--accent)}
.bm .bh{font-size:11.5px;color:var(--muted);padding:5px 8px;background:var(--chip);display:flex;justify-content:space-between;gap:6px}
.bm .bt{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;gap:8px}
.bm .bt+.bt{border-top:1px solid var(--line)}
.bm .bt.win{font-weight:700}
.bm .bt .s{font-variant-numeric:tabular-nums}

/* planning */
.plan{overflow-x:auto}
.plan table td{vertical-align:top;text-align:left;min-width:170px}
.plan td.t{font-weight:700;min-width:60px;color:var(--muted)}
.pm{border:1px solid var(--line);border-radius:7px;padding:5px 7px;cursor:pointer;font-size:13px;background:var(--panel)}
.pm:hover{border-color:var(--accent)}
.pm.done{opacity:.65}
.pm .muted{font-size:12px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow-y:auto}
.modal{background:var(--panel);border-radius:14px;max-width:620px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{font-size:18px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
#confirm .overlay{z-index:60}
.overlay.popup-wrap{align-items:center;padding:16px}
.modal.popup{max-width:440px;border-radius:14px;animation:pop .14s ease-out}
.modal.popup .actions{position:static;border:0;padding:0;margin-top:18px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.mm-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:14px 0;font-size:17px;font-weight:600}
.mm-teams>div:first-child{text-align:right}
.score-in{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.score-in input{width:100%;font-size:26px;text-align:center;padding:8px;font-weight:700}
.score-in input:first-child{justify-self:end}
.sets-in{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 10px;align-items:center;max-width:360px;margin:0 auto}
.sets-in input{width:100%;text-align:center;font-size:18px;font-weight:600}
.mm-state{margin:12px 0 0;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px;text-align:center}
.mm-state.todo{background:var(--chip);color:var(--muted)}
.mm-state.live{background:var(--danger-soft);color:var(--danger)}
.mm-state.done{background:var(--ok-soft);color:var(--ok)}
.mm-main{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.mm-main button{padding:11px 18px;font-size:15px;min-width:200px}
.live-sc{color:var(--danger)}
.d-score{font-size:3.6vh;font-weight:800;color:#ff8a8a;font-variant-numeric:tabular-nums;text-align:center}
.d-score small{font-size:2vh;color:#c6d2e6;display:block}
.sets-in input.auto{color:var(--accent);background:var(--accent-soft)}
.mm-sum{text-align:center;margin:12px 0 4px;font-weight:600;min-height:22px}
.tbbox{background:var(--warn-soft);border-radius:8px;padding:10px;margin-top:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2330;color:#fff;padding:10px 16px;border-radius:8px;z-index:70;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90vw}

/* display (écran public) */
body.display{background:#0b1220;color:#eef2f8;overflow:hidden}
body.display #app{max-width:none;padding:0;height:100vh;display:flex;flex-direction:column}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:1.4vh 2.2vw;background:#111b2e;border-bottom:2px solid #22324f}
.d-title{font-size:3vh;font-weight:800}
.d-sub{font-size:2.1vh;color:#8fb3ff;font-weight:600}
.d-right{display:flex;align-items:center;gap:1.5vw;font-size:3.4vh;font-weight:700;font-variant-numeric:tabular-nums}
.d-dots i{display:inline-block;width:1vh;height:1vh;border-radius:50%;background:#33445f;margin:0 .3vh}
.d-dots i.on{background:#8fb3ff}
.d-fs{background:transparent;border:1px solid #33445f;color:#eef2f8;font-size:2vh}
.d-body{flex:1;padding:2vh 2.2vw;overflow:hidden}
.d-courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(30vw,1fr));gap:1.6vh 1.6vw}
.d-court{background:#131f35;border-radius:1.2vh;padding:1.6vh 1.4vw;border:1px solid #22324f}
.d-court h3{font-size:2.4vh;color:#8fb3ff;margin-bottom:1vh;display:flex;justify-content:space-between}
.d-match{font-size:3vh;font-weight:700;display:grid;grid-template-columns:1fr auto 1fr;gap:1vw;align-items:center}
.d-match>div:first-child{text-align:right}
.d-match .vs{color:#8fb3ff;font-size:2.2vh}
.d-meta{font-size:1.9vh;color:#9aa8bf;margin-top:.6vh;text-align:center}
.d-next{font-size:2vh;color:#c6d2e6;margin-top:1.2vh;border-top:1px solid #22324f;padding-top:.8vh}
.d-tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(40vw,1fr));gap:2vh 2vw}
.d-tables h3{font-size:2.6vh;color:#8fb3ff;margin-bottom:.6vh}
.d-tables table td,.d-tables table th{font-size:2.2vh;padding:.6vh .6vw;border-color:#22324f}
.d-tables table th{color:#8fa0bb;font-size:1.6vh}
.d-results{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2vh 2vw;font-size:2.5vh}
.d-res{display:grid;grid-template-columns:1fr auto 1fr;gap:1vw;background:#131f35;padding:1.1vh 1vw;border-radius:1vh}
.d-res>div:first-child{text-align:right}
.d-res .win{color:#7ee2a8;font-weight:800}
.d-res small{grid-column:1/-1;text-align:center;color:#8fa0bb;font-size:1.6vh}
.d-bracket{display:flex;gap:1.6vw;height:100%}
.d-bracket .bcol{min-width:0;flex:1;gap:1.2vh;justify-content:space-around}
.d-bracket .bcol h4{font-size:1.8vh;color:#8fa0bb}
.d-bracket .bm{background:#131f35;border-color:#22324f}
.d-bracket .bm .bh{background:#1a2843;color:#9aa8bf;font-size:1.5vh}
.d-bracket .bm .bt{font-size:2.1vh;padding:.6vh .6vw}
.d-bracket .bm .bt+.bt{border-color:#22324f}
.d-bracket .bm .bt.win{color:#7ee2a8}
.d-final{display:grid;grid-template-columns:1fr 1fr;gap:3vw;align-items:start}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1.5vw;height:50vh}
.podium>div{flex:1;text-align:center;font-weight:800;font-size:3vh}
.podium .blk{background:#1a2843;border-radius:1vh 1vh 0 0;margin-top:1vh;display:flex;align-items:flex-start;justify-content:center;font-size:7vh;padding-top:1vh}
.d-empty{display:flex;align-items:center;justify-content:center;height:100%;font-size:4vh;color:#8fa0bb;text-align:center}

/* match en cours, estimation, formats */
.badge.live{background:var(--danger-soft);color:var(--danger)}
.mrow.live{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.d-court.live{border-color:#e05555;box-shadow:0 0 0 2px #e05555 inset}
.d-live{color:#ff7a7a;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.45}}
.est{display:flex;gap:28px;flex-wrap:wrap;margin-top:8px}
.est>div{display:flex;flex-direction:column}
.est b{font-size:17px}
.est.big b{font-size:22px;color:var(--accent)}
.est-card{border-left:4px solid var(--ok)}
.fmt{margin:4px 0 8px}
.tab-fmt{flex-basis:100%}
.tab-fmt .fmt{margin:0}

/* export PDF */
#print{display:none;--text:#000;--muted:#555;--line:#cfd5de;--panel:#fff;--chip:#eef1f5;color:#000;background:#fff;font-size:11px;line-height:1.3}
#print.measure{display:block;position:absolute;left:-10000px;top:0;width:186mm}
.pp-probe{height:273mm;width:1px}
.pp{width:186mm;padding:0}
.pp-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
.pp-t{font-size:18px;font-weight:800}
.pp-ph{font-size:16px;font-weight:800}
.pp-s{font-size:10px;color:#555}
.pp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pp-box{border:1px solid #cfd5de;border-radius:6px;padding:8px;margin-bottom:10px;break-inside:avoid}
.pp-box h4{font-size:13px;margin-bottom:4px}
.pp-box th,.pp-box td{padding:2px 4px;font-size:10.5px}
.pp-res{margin-top:6px}
.pp-res td{border-bottom:1px solid #eceff3}
.pp-res td.b{font-weight:700}
.pp .sm{font-size:9.5px;color:#555}
.pp-round{font-weight:700;font-size:10.5px;margin-top:6px;color:#333}
.pp-final td{font-size:14px;padding:5px 8px}
.pp .tm i{width:8px;height:8px}
.pp-court table td{border-bottom:1px solid #9aa3af;padding:3mm 2mm;vertical-align:middle;font-size:12px}
.pp-court td.r{text-align:right}
.pp-court td.mid{white-space:nowrap;text-align:center;width:1%}
.pp-court td.lab{width:24mm}
.pp-court td.ref{width:26mm}
.pp-court .tm-a,.pp-court .tm-b{font-size:13px;width:30%}
.pp-court .bx{display:inline-block;width:13mm;height:10mm;border:1.6px solid #000;border-radius:2px;vertical-align:middle;text-align:center;line-height:10mm;font-size:15px;font-weight:700}
.pp-court .bx.s{width:8mm;height:7.5mm;line-height:7.5mm;font-size:11px;margin:0 1px}
.pp-court .dash{margin:0 2mm;font-weight:700}
.pp-court .sets-bx{display:flex;flex-direction:column;gap:1.2mm}
.pp-court .sets-bx>div{display:flex;align-items:center;gap:1mm}
.pp-court .sets-bx .sm{width:5mm}
.pp-court .ph{color:#555;font-style:italic;font-size:11px}
.pp-court .wl{border-bottom:1px dotted #000;height:6mm;min-width:28mm}

/* téléphone et tablette */
.plan-list{display:none}
@media (max-width:1024px){
  #app{padding:0 12px 60px}
  .mrow{grid-template-columns:90px minmax(90px,1fr) minmax(260px,2fr) 120px}
}
@media (max-width:820px){
  .top-actions .badge{display:none}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:700px){
  body{font-size:15px}
  input,select,textarea{font-size:16px}
  #app{padding:0 10px 70px}
  .hide-sm{display:none!important}
  .top{padding:10px 0 6px;gap:6px}
  .top h1{font-size:18px}
  .top .ttl{min-width:0;flex-basis:calc(100% - 110px)}
  .top-actions{width:100%;flex-wrap:nowrap}
  .top-actions button{flex:1;padding:8px 6px}
  .tabs{margin:0 -10px 12px;padding:0 4px;scrollbar-width:none}
  .wz-wrap{margin:0 -10px 12px;padding:0 6px;gap:4px}
  .tabs button{padding:11px 10px;font-size:14px}
  .subtabs{flex-wrap:nowrap;overflow-x:auto;margin:0 -10px 12px;padding:0 10px 4px;scrollbar-width:none}
  .card{padding:12px;border-radius:8px}
  .wstep span{display:none}
  .wstep.on span{display:inline}
  .step-nav button{flex:1;padding:11px 8px}
  .step-nav .small{display:none}
  .next{margin-top:0}
  .next button{flex:1 1 100%}
  .gen-grid{grid-template-columns:1fr}
  .filters select{flex:1 1 45%}
  .mrow{grid-template-columns:1fr;gap:3px;padding:9px 10px}
  .mmeta,.mlabel{font-size:12px}
  .mlabel{order:-1}
  .mteams{gap:6px;font-size:14px}
  .mref{text-align:left}
  .hero{padding:20px 0 10px}
  .hero h1{font-size:23px}
  .tcards{grid-template-columns:1fr}
  button{padding:9px 12px}
  button.sm{padding:6px 10px}
  button.icon{min-width:36px}
  .fields{gap:10px}
  .fields .field{min-width:calc(50% - 5px);flex:1}
  .tab-row{flex-direction:column;align-items:stretch}
  .tab-row .spacer{display:none}
  .team-row{gap:6px}
  .team-row .seed{width:22px}
  .bcol{min-width:78vw}
  .bracket{scroll-snap-type:x mandatory}
  .bcol{scroll-snap-align:start}
  th,td{padding:6px 5px}
  .overlay:not(.popup-wrap){padding:0;align-items:stretch}
  .modal:not(.popup){border-radius:0;min-height:100%;padding:14px 14px 0;display:flex;flex-direction:column}
  .modal:not(.popup) .actions{position:sticky;bottom:0;background:var(--panel);padding:10px 0 14px;margin-top:auto;border-top:1px solid var(--line)}
  .modal.popup{padding:18px}
  .modal .actions button{flex:1 1 40%}
  .modal .actions .spacer{display:none}
  .mm-teams{font-size:15px}
  .score-in input{font-size:32px;padding:12px}
  .sets-in{max-width:none}
  .sets-in input{font-size:22px;padding:11px}
  .mm-main button{flex:1 1 100%;min-width:0;padding:13px}
  .plan-grid{display:none}
  .plan-list{display:block}
  .est{gap:16px}
  .est.big b{font-size:19px}
  .toast{bottom:12px;width:calc(100% - 24px);text-align:center}
}
@media print{
  .tabs,.subtabs,.top-actions,.no-print,.filters,button{display:none!important}
  body{background:#fff;color:#000}
  .card,.mrow,.pm{box-shadow:none;break-inside:avoid}
  body.printing #app,body.printing #modal,body.printing #confirm,body.printing .toast,body.printing .pp-probe{display:none!important}
  body.printing #print{display:block}
  body.printing{background:#fff}
  @page{size:A4 portrait;margin:12mm}
  .pp{break-after:page}
  .pp:last-of-type{break-after:auto}
}
</style>

<div id="app"></div>

<div id="confirm"></div>
<div id="print"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
'use strict';
/* ============================================================
   Tournoi Manager — gestion de tournois de sports collectifs
   Données : localStorage + sauvegardes de secours + fichier lié
   ============================================================ */
const KEY = 'tournoi-manager:v1', BKEY = 'tournoi-manager:backups';
const DISPLAY = location.hash.startsWith('#ecran');
const COLORS = ['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#42d4f4','#f032e6','#9acd32','#fa8072','#469990','#b088f9','#9a6324','#800000','#2e8b57','#808000','#000075','#708090','#ff8c00','#1e90ff','#c71585'];
const SPORTS = {
  football:{name:'Football',mode:'time',unit:'buts',draw:true},
  futsal:{name:'Futsal',mode:'time',unit:'buts',draw:true},
  handball:{name:'Handball',mode:'time',unit:'buts',draw:true},
  basketball:{name:'Basket-ball',mode:'time',unit:'points',draw:false},
  basket3x3:{name:'Basket 3x3',mode:'time',unit:'points',draw:false},
  volleyball:{name:'Volley-ball',mode:'sets',unit:'points',sets:{type:'bestof',count:3,points:25,lastPoints:15,lead2:true,cap:0}},
  beachvolley:{name:'Beach-volley',mode:'sets',unit:'points',sets:{type:'bestof',count:3,points:21,lastPoints:15,lead2:true,cap:0}},
  rugby:{name:'Rugby à XV',mode:'time',unit:'points',draw:true},
  rugby7:{name:'Rugby à 7',mode:'time',unit:'points',draw:true},
  touch:{name:'Touch rugby',mode:'time',unit:'essais',draw:true},
  hockey:{name:'Hockey (gazon / salle)',mode:'time',unit:'buts',draw:true},
  icehockey:{name:'Hockey sur glace',mode:'time',unit:'buts',draw:true},
  waterpolo:{name:'Water-polo',mode:'time',unit:'buts',draw:true},
  floorball:{name:'Floorball / Unihockey',mode:'time',unit:'buts',draw:true},
  korfball:{name:'Korfbal',mode:'time',unit:'buts',draw:true},
  netball:{name:'Netball',mode:'time',unit:'buts',draw:true},
  ultimate:{name:'Ultimate',mode:'score',unit:'points',draw:false},
  baseball:{name:'Baseball / Softball',mode:'score',unit:'points',draw:false},
  badminton:{name:'Badminton (équipes)',mode:'sets',unit:'points',sets:{type:'bestof',count:3,points:21,lastPoints:21,lead2:true,cap:30}},
  pingpong:{name:'Tennis de table',mode:'sets',unit:'points',sets:{type:'bestof',count:5,points:11,lastPoints:11,lead2:true,cap:0}},
  tennis:{name:'Tennis / Padel',mode:'sets',unit:'jeux',sets:{type:'bestof',count:3,points:6,lastPoints:6,lead2:true,cap:7}},
  petanque:{name:'Pétanque',mode:'score',unit:'points',draw:false},
  other:{name:'Autre sport',mode:'score',unit:'points',draw:true},
};

/* ---------- utilitaires ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmtTime = m => m == null || isNaN(m) ? '--:--' : `${pad(Math.floor(m / 60) % 24)}:${pad(Math.round(m % 60))}`;
const parseTime = s => { const r = /^(\d{1,2}):(\d{2})/.exec(String(s || '').trim()); return r ? +r[1] * 60 + +r[2] : null; };
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const letter = i => String.fromCharCode(65 + i % 26) + (i >= 26 ? Math.floor(i / 26) : '');
const ord = n => n === 1 ? '1er' : `${n}e`;
const num = v => { if (v === '' || v == null) return null; const x = Number(v); return isNaN(x) ? null : x; };
const capz = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const ratio = (a, b) => b ? a / b : (a ? 1e9 : 0);
const fmtRatio = (a, b) => b ? (a / b).toFixed(3) : (a ? 'MAX' : '–');
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

/* ---------- stockage ---------- */
let db = loadDb(), rev = 0, fileHandle = null, fileTimer = null, lastFileSave = 0;
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('tournoi-manager') : null;
function loadDb() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.tournaments) return d; } catch (e) {}
  return { version: 1, currentId: null, tournaments: {} };
}
function invalidate() { rev++; }
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('⚠ Sauvegarde impossible dans le navigateur ! Exportez vos données.', 6000); }
  if (bc) bc.postMessage('update');
  if (fileHandle) { clearTimeout(fileTimer); fileTimer = setTimeout(writeFile, 700); }
}
function save() { const t = T(); if (t) t.updatedAt = Date.now(); invalidate(); persist(); maybeBackup(); }
function getBackups() { try { return JSON.parse(localStorage.getItem(BKEY)) || []; } catch (e) { return []; } }
function backup(label, t = T()) {
  if (!t || SIM) return;
  let list = getBackups();
  list.unshift({ ts: Date.now(), tid: t.id, name: t.name, label, data: JSON.stringify(t) });
  const per = {}; list = list.filter(b => (per[b.tid] = (per[b.tid] || 0) + 1) <= 8).slice(0, 24);
  while (list.length) {
    try { localStorage.setItem(BKEY, JSON.stringify(list)); return; } catch (e) { list.pop(); }
  }
}
function maybeBackup() {
  const t = T(); if (!t) return;
  const last = getBackups().find(b => b.tid === t.id);
  if (!last || Date.now() - last.ts > 5 * 60000) backup('Automatique');
}
async function linkFile() {
  if (!window.showSaveFilePicker) return toast('Fonction disponible uniquement sur Chrome ou Edge (ordinateur).', 4000);
  try {
    fileHandle = await showSaveFilePicker({ suggestedName: 'tournois-sauvegarde.json', types: [{ description: 'Sauvegarde JSON', accept: { 'application/json': ['.json'] } }] });
    await writeFile(); toast('Fichier lié : chaque modification y est enregistrée.'); closeModal(); render();
  } catch (e) { /* annulé */ }
}
async function writeFile() {
  if (!fileHandle) return;
  try { const w = await fileHandle.createWritable(); await w.write(JSON.stringify(db, null, 1)); await w.close(); lastFileSave = Date.now(); }
  catch (e) { toast('⚠ Échec de l\'écriture du fichier de sauvegarde.', 4000); }
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() || 'tournoi';

/* ---------- état d'interface ---------- */
const T = () => db.tournaments[db.currentId];
let ui = { view: T() ? 't' : 'home', tab: 'config', cfg: 'general', mf: { phase: 'all', court: 'all', status: 'all', q: '' }, planTeam: '', mm: null, other: new Set(), genI: null };
let _mi = null, _miRev = -1, _miT = null;
function mById(id) {
  const t = T();
  if (!_mi || _miRev !== rev || _miT !== t) { _mi = new Map(t.matches.map(m => [m.id, m])); _miRev = rev; _miT = t; }
  return _mi.get(id);
}

/* ---------- modèle : valeurs par défaut ---------- */
function setsKeys(t) {
  const s = t.scoring.sets, out = [];
  if (s.type === 'bestof') {
    const k = Math.ceil(s.count / 2);
    for (let l = 0; l < k; l++) out.push(`${k}-${l}`);
    for (let l = k - 1; l >= 0; l--) out.push(`${l}-${k}`);
  } else for (let a = s.count; a >= 0; a--) out.push(`${a}-${s.count - a}`);
  return out;
}
function defaultSetPts(t, key) {
  const P = t.points, s = t.scoring.sets, [a, b] = key.split('-').map(Number);
  if (a > b) return s.type === 'bestof' && b === a - 1 && a > 1 ? P.win - 1 : P.win;
  if (a === b) return P.draw;
  return s.type === 'bestof' && a === b - 1 && b > 1 ? P.loss + 1 : P.loss;
}
function ensureSetsTable(t) {
  const old = t.points.setsTable || {}, nt = {};
  setsKeys(t).forEach(k => nt[k] = k in old ? old[k] : defaultSetPts(t, k));
  t.points.setsTable = nt;
}
function applySport(t, key) {
  const s = SPORTS[key] || SPORTS.other;
  t.sport = key;
  t.scoring = { mode: s.mode, unit: s.unit, allowDraw: !!s.draw,
    sets: Object.assign({ type: 'bestof', count: 3, points: 25, lastPoints: 15, lead2: true, cap: 0 }, s.sets || {}),
    forfeitScore: { w: s.mode !== 'sets' ? 3 : 0, l: 0 } };
  t.points = { win: 3, draw: 1, loss: 0, forfeit: 0, useSetsTable: false, setsTable: {},
    bonusOff: { on: false, margin: 3, pts: 1 }, bonusDef: { on: false, margin: 7, pts: 1 } };
  ensureSetsTable(t);
  t.tiebreakers = s.mode === 'sets' ? ['pts', 'wins', 'setratio', 'ratio', 'h2h', 'lot'] : ['pts', 'h2h', 'diff', 'scored', 'lot'];
}
function setTeamCount(t, n) {
  n = Math.max(2, Math.min(128, n | 0));
  while (t.teams.length < n) { const i = t.teams.length; t.teams.push({ id: uid(), name: `Équipe ${i + 1}`, color: COLORS[i % COLORS.length], lot: Math.random() }); }
  t.teams.length = n;
}
function poolsPhase(o = {}) { return Object.assign({ id: uid(), type: 'pools', name: 'Poules', nbPools: 2, roundTrip: false, distribution: 'serpentine', levels: false, duration: '', start: '', status: 'draft' }, o); }
function bracketPhase(o = {}) { return Object.assign({ id: uid(), type: 'bracket', name: 'Phase finale', tableaux: [], duration: '', start: '', status: 'draft' }, o); }
function defaultTableaux(n) {
  if (n < 2) return [];
  let P = 2; while (P * 2 <= n) P *= 2;
  const out = [{ name: 'Tableau principal', from: 1, to: P, full: true, third: true }];
  if (n - P >= 2) out.push({ name: 'Consolante', from: P + 1, to: n, full: true, third: true });
  return out;
}
const suggestPools = n => n <= 5 ? 1 : Math.max(2, Math.round(n / 4));
const poolSizes = (n, k) => { const b = Math.floor(n / k), r = n % k; return Array.from({ length: k }, (_, i) => b + (i < r ? 1 : 0)); };
const TPL_DESC = {
  champ: ['Une seule poule : chaque équipe rencontre toutes les autres. Le classement de la poule est le classement final.', 'Poule unique'],
  pf: ['Des poules de 3 à 5 équipes, puis un tableau final avec matchs de classement pour toutes les places (et une consolante si besoin).', 'Poules → Phase finale'],
  bn: ['Un brassage en poules, puis des poules de niveau (haute, moyenne, basse…) formées d\'après le classement du brassage. Pas de tableau.', 'Brassage → Poules de niveau'],
  bnf: ['Brassage, poules de niveau, puis une petite phase finale dans chaque niveau.', 'Brassage → Poules de niveau → Finales par niveau'],
  ko: ['Un tableau à élimination directe dès le départ, avec matchs de classement pour toutes les places.', 'Tableau'],
};
/* modèle correspondant aux phases actuelles (même enchaînement de types et de réglages), sinon « personnalisé » */
function templateKey(t) {
  const sig = ps => JSON.stringify(ps.map(p => [p.type, p.type === 'pools' ? [p.distribution, !!p.levels, !!p.roundTrip] : p.tableaux.length]));
  const cur = sig(t.phases);
  const tp = TEMPLATES.find(x => sig(x.f(t.teams.length)) === cur);
  return tp ? tp.k : 'custom';
}
function structureCard(t) {
  const st = started(t), cur = templateKey(t);
  const cards = TEMPLATES.map(x => {
    const on = x.k === cur, phases = x.f(t.teams.length);
    const nb = phases.reduce((s, ph) => s + estimateMatches(t, ph), 0), e = estimateFor(t, phases);
    return `<div class="tpl ${on ? 'on' : 'pick'}" ${on ? '' : `data-act="tplApply" data-k="${x.k}" role="button" tabindex="0"`}><div class="tpl-h"><b>${esc(x.l)}</b>${on ? '<span class="badge act">Choisi</span>' : ''}</div>
      <div class="tpl-s">${esc(TPL_DESC[x.k][1])}</div><p class="small muted">${TPL_DESC[x.k][0]}</p>
      <div class="row"><span class="muted small grow">${phases.length} phase${phases.length > 1 ? 's' : ''} · ${nb} matchs${e ? ` · <b>≈ ${fmtDuration(e.end - e.start)}</b>` : ''}</span>${on ? '' : `<span class="tpl-go">${st ? 'Changer' : 'Choisir'} ›</span>`}</div></div>`;
  }).join('');
  const custom = cur === 'custom' ? `<div class="tpl on"><div class="tpl-h"><b>Personnalisé</b><span class="badge act">Choisi</span></div><div class="tpl-s">${esc(t.phases.map(p => p.name).join(' → ') || 'aucune phase')}</div><p class="small muted">Enchaînement composé à la main dans les phases ci-dessous.</p></div>` : '';
  return `<div class="card"><h3>Structure du tournoi</h3>
    <p class="muted small" style="margin-top:0">${st ? 'Le tournoi est lancé : changer de structure efface les matchs déjà générés (un point de restauration est créé avant).' : 'Cliquez sur un modèle pour le choisir, puis ajustez les phases ci-dessous si besoin (nombre de poules, tableaux, formats…).'}</p>
    <div class="tpls">${cards}${custom}</div></div>`;
}
const TEMPLATES = [
  { k: 'champ', l: 'Championnat (poule unique)', f: n => [poolsPhase({ name: 'Championnat', nbPools: 1 })] },
  { k: 'pf', l: 'Poules + phase finale', f: n => [poolsPhase({ nbPools: suggestPools(n) }), bracketPhase({ tableaux: defaultTableaux(n) })] },
  { k: 'bn', l: 'Brassage + poules de niveau', f: n => { const k = suggestPools(n); return [poolsPhase({ name: 'Brassage', nbPools: k }), poolsPhase({ name: 'Poules de niveau', nbPools: k, distribution: 'level', levels: true })]; } },
  { k: 'bnf', l: 'Brassage + niveaux + finales par niveau', f: n => {

    <nav class="tabs">${tabs.map(([k, l], i) => `<button class="${ui.tab === k ? 'on' : ''}" data-act="tab" data-k="${k}"><i>${i + 1}</i>${l}</button>`).join('')}</nav>
    ${nextBanner(t)}

}

/* ---------- préparation : 6 étapes ---------- */
function viewPrep(t) {
  if (!PREP_STEPS.some(s => s[0] === ui.cfg)) ui.cfg = 'general';
  const idx = PREP_STEPS.findIndex(s => s[0] === ui.cfg), st = started(t);

  const body = { general: cfgGeneral, format: cfgFormat, teams: cfgTeams, phases: cfgPhases, sched: cfgSched, launch: cfgLaunch }[ui.cfg](t);
  const prev = PREP_STEPS[idx - 1], next = PREP_STEPS[idx + 1];
  const nav = `<div class="step-nav">${prev ? `<button data-act="cfg" data-k="${prev[0]}">‹ ${prev[1]}</button>` : '<span></span>'}<span class="muted small">Étape ${idx + 1} / ${PREP_STEPS.length}</span>${next ? `<button class="primary" data-act="cfg" data-k="${next[0]}">${next[1]} ›</button>` : '<span></span>'}</div>`;
  return `${stepper}<h2 class="step-title">${idx + 1}. ${PREP_STEPS[idx][1]}</h2>
    ${st && ui.cfg !== 'launch' ? '<div class="note">Le tournoi est lancé : les réglages qui touchent aux matchs déjà générés sont verrouillés, les autres restent modifiables.</div>' : ''}
    ${body}${nav}`;
}
function cfgLaunch(t) {
  const sc = t.scoring, P = t.points, S = t.schedule, st = started(t), n = t.teams.length;
  const unnamed = t.teams.filter(x => /^Équipe \d+$/.test(x.name.trim())).length;
  const warns = [];
  if (unnamed) warns.push(`${unnamed} équipe${unnamed > 1 ? 's n\'ont' : ' n\'a'} pas encore de nom (étape 3).`);
  if (new Set(t.teams.map(x => x.name.trim().toLowerCase())).size < n) warns.push('Deux équipes portent le même nom (étape 3).');
  if (!t.phases.length) warns.push('Aucune phase (étape 4).');
  t.phases.forEach(ph => { if (ph.type === 'bracket' && !ph.tableaux.some(tb => tableauRange(tb, n))) warns.push(`« ${esc(ph.name)} » n'a aucun tableau valide (étape 4).`); });
  const fmt = sc.mode === 'sets' ? setsFormatLabel(sc.sets) : sc.mode === 'time' ? `au temps, ${S.duration} min` : `score simple (${sc.unit})`;
  const pts = P.useSetsTable && sc.mode === 'sets' ? 'barème selon le score en sets' : `victoire ${P.win}${sc.allowDraw ? `, nul ${P.draw}` : ''}, défaite ${P.loss}`;
  const row = (l, v) => `<tr><td class="muted small">${l}</td><td>${v}</td></tr>`;
  const edit = k => st ? '' : `<button class="sm ghost" data-act="cfg" data-k="${k}">Modifier</button>`;
  const first = t.phases[0];
  return `<div class="grid2">
    <div class="card"><div class="row"><h3 class="grow">Tournoi</h3>${edit('general')}</div><table class="recap">${row('Nom', esc(t.name))}${row('Date · lieu', [fmtDate(t.date), esc(t.place)].filter(Boolean).join(' · ') || '—')}${row('Sport', esc((SPORTS[t.sport] || SPORTS.other).name))}</table></div>
    <div class="card"><div class="row"><h3 class="grow">Format & points</h3>${edit('format')}</div><table class="recap">${row('Match', esc(fmt))}${row('Planning', `${S.duration} min par match + ${S.changeover} min de battement`)}${row('Points', esc(pts))}${row('Départage', esc(activeCriteria(t).map(k => CRIT[k].l(t).replace(/ \(.*\)$/, '')).join(' › ')))}</table></div>
    <div class="card"><div class="row"><h3 class="grow">Équipes (${n})</h3>${edit('teams')}</div><div class="chips">${t.teams.map(x => teamTag(x.id)).join('')}</div></div>
    <div class="card"><div class="row"><h3 class="grow">Déroulement</h3>${edit('phases')}</div><div class="tpl-s" style="margin-bottom:6px">${esc((TEMPLATES.find(x => x.k === templateKey(t)) || { l: 'Personnalisé' }).l)}</div><ol class="recap-ol">${t.phases.map((ph, i) => `<li><b>${esc(ph.name)}</b> <span class="muted small">— ${phaseInfo(t, ph, i)}</span></li>`).join('') || '<li class="muted">Aucune phase</li>'}</ol></div>

/* ---------- matchs : barre des phases + liste / planning ---------- */
function phaseBar(t) {
  const li = t.phases.reduce((a, p, i) => p.status !== 'draft' ? i : a, -1);   // dernière phase générée
  const chips = t.phases.map((ph, i) => {
    const ms = phaseMatches(t, ph), done = ms.filter(m => m.done).length;
    const cls = ph.status === 'draft' ? 'todo' : done === ms.length ? 'ok' : 'act';
    const info = ph.status === 'draft' ? 'à générer' : done === ms.length ? 'terminée' : `${done}/${ms.length} matchs`;
    return `<div class="pchip ${cls}"><i>${cls === 'ok' ? '✓' : i + 1}</i><div><b>${esc(ph.name)}</b><span>${info}</span></div></div>`;
  }).join('<span class="parrow">›</span>');
  const acts = [], nx = li + 1;
  if (t.phases[nx]) acts.push(canGenerate(t, nx) ? `<button class="primary sm" data-act="genPrep" data-i="${nx}">Générer « ${esc(t.phases[nx].name)} »</button>`
    : `<span class="muted small">« ${esc(t.phases[nx].name)} » pourra être générée quand « ${esc(t.phases[li].name)} » sera terminée.</span>`);
  if (li >= 0) {
    const ph = t.phases[li];
    if (ph.type === 'pools' && !phaseMatches(t, ph).some(m => m.done)) acts.push(`<button class="sm" data-act="compo" data-i="${li}">Modifier les poules</button>`);
    acts.push(`<span class="spacer"></span><button class="sm ghost danger" data-act="resetPhase" data-i="${li}">Réinitialiser « ${esc(ph.name)} »</button>`);
  }
  return `<div class="card phasebar"><div class="pchips">${chips}</div><div class="row pacts">${acts.join('')}</div></div>`;
}
function viewPlay(t) {
  if (!t.phases.length) return '<div class="card">Aucune phase : composez le déroulement dans Préparation › Déroulement.</div>';
  if (!['list', 'planning'].includes(ui.mt)) ui.mt = 'list';
  const subs = [['list', 'Liste des matchs'], ['planning', 'Planning par terrain']];
  return `${phaseBar(t)}<div class="subtabs">${subs.map(([k, l]) => `<button class="${ui.mt === k ? 'on' : ''}" data-act="mt" data-k="${k}">${l}</button>`).join('')}</div>${ui.mt === 'list' ? viewMatches(t) : viewPlanning(t)}`;
}

/* ---------- résultats ---------- */
function viewResults(t) {

}

/* ---------- configuration ---------- */

    ${field('Nom du tournoi', inp('name'))}

}
function cfgFormat(t) {

  return `<div class="grid2"><div class="card"><h3>Format de match</h3>

    <p class="muted small" style="margin-top:-4px">${sc.mode === 'time' ? 'Durée de jeu de chaque match, utilisée pour le planning.' : 'Durée moyenne d\'un match, utilisée pour construire le planning et estimer la fin du tournoi.'} Elle peut être différente pour chaque phase (onglet Phases).</p>
    <label class="check">${inp('scoring.allowDraw', 'data-rr', 'checkbox')} Match nul possible en poule</label>

      : `<div class="fields">${field('Score du vainqueur', inp('scoring.forfeitScore.w', 'min="0"', 'number'))}${field('Score du forfait', inp('scoring.forfeitScore.l', 'min="0"', 'number'))}</div>`}
    <p class="muted small">En phase finale, une égalité doit être départagée (prolongation, tirs au but…) : vous indiquerez le vainqueur à la saisie.</p></div>

    ${sets && P.useSetsTable ? `<table style="max-width:300px"><tr><th class="l">Score en sets</th><th>Points</th></tr>
      ${setsKeys(t).map(k => `<tr><td class="l">${k.replace('-', ' – ')}</td><td><input type="number" data-type="num" data-bind="points.setsTable.${k}" value="${esc(P.setsTable[k])}" style="width:80px"></td></tr>`).join('')}</table>
      <div class="fields" style="margin-top:12px">${field('Défaite par forfait', selOr('points.forfeit', [0, -1]))}</div>
      ${t.phases.some(ph => (ph.fmt && ph.fmt.on) || ph.tableaux && ph.tableaux.some(tb => tb.fmt && tb.fmt.on)) ? `<p class="muted small">Pour les phases jouées dans un autre format de sets, si un score n'est pas dans ce tableau :</p>
      <div class="fields">${field('Victoire', selOr('points.win', [1, 2, 3]))}${sc.allowDraw ? field('Match nul', selOr('points.draw', [0, 1])) : ''}${field('Défaite', selOr('points.loss', [0, 1]))}</div>` : ''}`
    : `<div class="fields">${field('Victoire', selOr('points.win', [1, 2, 3]))}${sc.allowDraw ? field('Match nul', selOr('points.draw', [0, 1])) : ''}${field('Défaite', selOr('points.loss', [0, 1]))}${field('Défaite par forfait', selOr('points.forfeit', [0, -1]))}</div>`}
    ${!sets ? `<h3 style="margin-top:8px">Bonus (optionnel)</h3>

      <label class="check">${inp('points.bonusDef.on', 'data-rr', 'checkbox')} Bonus défensif</label>

    <p class="muted small">Les points et les critères peuvent être modifiés à tout moment : les classements sont recalculés.</p></div></div>

    <p class="muted small">La confrontation directe compare les matchs joués entre les seules équipes encore à égalité. Pour comparer des équipes de poules différentes (ex. meilleurs 2es), les valeurs sont ramenées à la moyenne par match et la confrontation directe est ignorée.</p></div>`;
}
function cfgTeams(t) {
  const lock = started(t);
  return `<div class="card">
    ${lock ? '<div class="note">Le tournoi a commencé : vous pouvez renommer les équipes, mais pas en ajouter ni en retirer.</div>'
      : `<div class="row" style="margin-bottom:12px"><label class="row"><span class="muted small">Nombre d'équipes</span><input type="number" id="teamCount" min="2" max="128" value="${t.teams.length}"></label>

        <button data-act="teamsPaste">Coller une liste…</button><button data-act="teamsShuffle">Mélanger l'ordre</button><button data-act="teamsSort">Trier A→Z</button></div>
        <p class="muted small" style="margin-top:0">L'ordre de la liste sert de classement de départ pour la première phase (têtes de série pour la répartition en poules ou le tableau).</p>`}
    ${t.teams.map((x, i) => `<div class="team-row"><span class="seed">${i + 1}</span>

function phaseInfo(t, ph, i) {
  const n = t.teams.length;
  if (ph.type === 'pools') {
    const k = Math.max(1, Math.min(Number(ph.nbPools) || 1, Math.floor(n / 2) || 1)), sz = poolSizes(n, k);
    const mn = Math.min(...sz), mx = Math.max(...sz);
    return `${n} équipes → ${k} poule${k > 1 ? 's' : ''} de ${mn === mx ? mn : mn + ' à ' + mx} équipes · ${estimateMatches(t, ph)} matchs`;
  }
  return `${estimateMatches(t, ph)} matchs`;
}
function cfgPhases(t) {
  const n = t.teams.length, st = started(t);

      if (!ph.tableaux.length) msgs.push(`${ph.name} : aucun tableau.`);
      ph.tableaux.forEach((tb, j) => {
        if (!tableauRange(tb, n)) msgs.push(`${ph.name} · ${tb.name} : plage de classement invalide.`);
        else if (Number(tb.to) > n) msgs.push(`${ph.name} · ${tb.name} : il n'y a que ${n} équipes, le tableau sera limité.`);
        ph.tableaux.forEach((o, k) => { if (k > j && tableauRange(o, n) && tableauRange(tb, n) && Number(o.from) <= Number(tb.to) && Number(o.to) >= Number(tb.from)) msgs.push(`${ph.name} : les tableaux « ${tb.name} » et « ${o.name} » se chevauchent.`); });
      });
    }
  });
  return `${structureCard(t)}
    <h3 style="margin:18px 0 10px">Phases${t.phases.length ? ` (${t.phases.length})` : ''}</h3>
    <div class="card est-card"><div class="row"><h3 class="grow" style="margin:0">Estimation du tournoi</h3><span class="muted small">simulation du planning : terrains, durées, pauses, repos, ordre des phases</span></div>${estimateHTML(t, true)}</div>
    ${msgs.map(m => `<div class="note warn">${esc(m)}</div>`).join('')}
    ${t.phases.map((ph, i) => phaseCard(t, ph, i)).join('')}
    <div class="row no-print"><button data-act="phaseAdd" data-k="pools">+ Phase de poules</button><button data-act="phaseAdd" data-k="bracket">+ Phase finale (tableaux)</button></div>`;
}
/* bloc « format spécifique » d'une phase (ph) ou d'un tableau (ph + tb) */
function fmtBlock(t, ph, tb, path, dis) {

  if (!obj.fmt) obj.fmt = { on: false, sets: Object.assign({}, scoringFor(t, tb ? ph : null).sets), duration: '' };
  const f = obj.fmt;

        mid = `<div class="sets-bx">${Array.from({ length: n }, (_, i) => { const s = m.done && !m.forfeit && m.sets ? m.sets[i] : null; return `<div><span class="sm">S${i + 1}</span>${box(s && s[0], 1)}<span>-</span>${box(s && s[1], 1)}</div>`; }).join('')}</div>`;
      } else mid = `${box(m.done && !m.forfeit ? m.score[0] : '')}<span class="dash">–</span>${box(m.done && !m.forfeit ? m.score[1] : '')}`;
      return `<tr><td class="l"><b>${fmtTime(m.time)}</b><div class="sm">M${m.num}</div></td><td class="l sm lab">${esc(matchLabel(t, m, false))}</td>
        <td class="r tm-a">${side(m.a)}</td><td class="mid">${mid}</td><td class="l tm-b">${side(m.b)}</td>
        <td class="l sm ref">${t.schedule.referee || m.referee ? `Arbitre<br>${m.referee ? `<b>${esc(tname(m.referee))}</b>` : '<div class="wl"></div>'}` : ''}</td></tr>`;
    }).join('');
    const sc = scoringFor(t, ph, null);
    return `<section class="pp pp-court">${pdfHead(t, c, `${ph.name}${sc.mode === 'sets' ? ' · ' + setsFormatLabel(sc.sets) : ''}`)}
      <table>${rows}</table><div class="sm" style="margin-top:8px">Forfait : écrire « F » dans la case de l'équipe forfait. Rapporter la feuille à la table de marque après chaque match.</div></section>`;
  }).join('');
}
function printPages(html) {
  const box = document.getElementById('print');
  box.innerHTML = html + '<div class="pp-probe"></div>'; box.classList.add('measure');
  // réduit chaque page pour qu'elle tienne sur une feuille A4 (186 × 273 mm imprimables)
  const pageH = box.querySelector('.pp-probe').offsetHeight;
  box.querySelectorAll('.pp').forEach(p => { p.style.zoom = ''; const h = p.scrollHeight; if (h > pageH) p.style.zoom = (pageH / h * 0.98).toFixed(3); });
  box.classList.remove('measure'); document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); box.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 50);
}

function ntBuild(name) {
  const v = id => document.getElementById(id).value, n = Math.max(2, Math.min(128, Number(v('ntN')) || 8));

  applySport(t, v('ntSport')); setTeamCount(t, n);

  const S = t.schedule, c = Math.max(1, Math.min(40, Number(v('ntC')) || 1));
  S.courts = Array.from({ length: c }, (_, i) => `Terrain ${i + 1}`);
  S.duration = Math.max(1, Number(v('ntD')) || 15); S.changeover = Math.max(0, Number(v('ntB')) || 0);

}

/* avant de générer une phase : qui entre, où, et la structure encore modifiable */
function genModal(i) {
  const t = T(), ph = t.phases[i], prev = t.phases[i - 1], n = t.teams.length;
  ui.genI = i;
  const input = i === 0 ? t.teams.map((x, k) => ({ id: x.id, grank: k + 1 })) : phaseRanking(t, prev);
  const dest = g => {
    if (ph.type === 'bracket') { const tb = ph.tableaux.find(x => tableauRange(x, n) && g >= Number(x.from) && g <= Number(x.to)); return tb ? tb.name : 'hors tableaux : garde son rang'; }
    if (ph.distribution === 'level') { const k = Math.max(1, Math.min(Number(ph.nbPools) || 1, Math.floor(n / 2) || 1)); let acc = 0; const sz = poolSizes(n, k); for (let j = 0; j < sz.length; j++) { acc += sz[j]; if (g <= acc) return ph.levels ? `Niveau ${j + 1}` : `Poule ${letter(j)}`; } }
    return ph.distribution === 'random' ? 'tirage au sort' : 'serpentin';
  };
  const valid = ph.type !== 'bracket' || ph.tableaux.some(tb => tableauRange(tb, n));
  showModal(`<div data-modal="gen"><h3>Préparer « ${esc(ph.name)} »</h3>
    <p class="muted small">Vérifiez la structure de la phase et ajustez-la si besoin, puis générez ses matchs. ${i ? `Les équipes entrent d'après le classement de « ${esc(prev.name)} ».` : 'Les équipes entrent dans l\'ordre de la liste.'}</p>

    <div>${phaseCard(t, ph, i, true)}</div></div>
    <div class="actions"><button data-act="modalClose">Annuler</button><span class="spacer"></span><button class="primary" data-act="gen" data-i="${i}" ${valid ? '' : 'disabled'}>Générer les ${estimateMatches(t, ph)} matchs</button></div></div>`, 'wide');
}

      <div class="actions"><button data-act="modalClose">Annuler</button><button class="primary" data-act="shiftGo">Décaler</button></div>`);
  },
  shiftGo() { const t = T(), d = Number(document.getElementById('shMin').value) || 0; t.matches.forEach(m => { if (!m.done && m.time != null) m.time += d; }); closeModal(); save(); render(); toast(`Matchs non joués décalés de ${d} min.`); },
};
const CH = {
  async sport(el) {
    const t = T(); if (anyDone(t)) return render();
    if (!await askConfirm('Changer de sport réinitialise le format de match, le barème de points et les critères de départage. Continuer ?', 'Changer', false)) return render();
    applySport(t, el.value); save(); render();
  },
  courtCount(el) {
    const S = T().schedule, n = Math.max(1, Math.min(40, Number(el.value) || 1));
    while (S.courts.length < n) S.courts.push(`Terrain ${S.courts.length + 1}`);
    S.courts.length = n; save(); setTimeout(render);
  },
  nt() { ntEstimate(); },
  mf(el) { ui.mf[el.dataset.k] = el.value; render(); },
  planTeam(el) { ui.planTeam = el.value; render(); },
};
document.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.overlay && !e.target.closest('#confirm')) { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  fn(el, e);
  if (ui.genI != null && el.closest('#modal') && !['gen', 'genPrep', 'modalClose'].includes(el.dataset.act)) refreshGenModal();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.bind) {
    const t = T();
    let v = el.type === 'checkbox' ? el.checked : el.dataset.type === 'num' ? (el.value === '' ? (el.placeholder ? '' : 0) : Number(el.value)) : el.value;
    if (el.type === 'number' && el.min !== '' && v !== '' && v < Number(el.min)) { v = Number(el.min); el.value = v; }
    setPath(t, el.dataset.bind, v);
    if (el.dataset.bind.startsWith('scoring.')) ensureSetsTable(t);
    save();
    if (el.dataset.rr !== undefined) setTimeout(() => { render(); refreshGenModal(); });
  } else if (el.dataset.selor) {
    const path = el.dataset.selor, t = T();
    if (el.value === '__other') {
      ui.other.add(path); render(); refreshGenModal();
      const inp = document.querySelector(`[data-bind="${CSS.escape(path)}"]`); if (inp) { inp.focus(); inp.select(); }
      return;
    }
    ui.other.delete(path); setPath(t, path, Number(el.value));
    if (path.startsWith('scoring.')) ensureSetsTable(t);
    save(); render(); refreshGenModal();
  } else if (el.dataset.ch && CH[el.dataset.ch]) CH[el.dataset.ch](el);
});
document.addEventListener('input', e => {
  const k = e.target.dataset.inp;
  if (k === 'mm') { mmAuto(e.target); mmUpdate(); }
  else if (k === 'nt') ntEstimate();
  else if (k === 'mfq') { ui.mf.q = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('pick')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape' && document.getElementById('modal').innerHTML && !document.getElementById('confirm').innerHTML) closeModal();
  if (e.key === 'Enter' && ui.mm && e.target.tagName === 'INPUT' && document.getElementById('mmsum')) { e.preventDefault(); const mm = mById(ui.mm); mm && mm.live && !mm.done ? A.mmLiveSave() : A.mmSave(); }
  // Tab après une saisie complétée automatiquement : on passe directement au set suivant
  if (e.key === 'Tab' && !e.shiftKey && ui.mm) {
    const r = /^s(\d+)a$/.exec(e.target.id), other = r && document.getElementById(`s${r[1]}b`);
    if (other && other.dataset.auto) { e.preventDefault(); (document.getElementById(`s${Number(r[1]) + 1}a`) || document.querySelector('[data-act="mmSave"]')).focus(); }
  }
  if (DISPLAY) {
    if (e.key === 'ArrowRight') { dIdx++; renderDisplay(); scheduleRotate(); }
    if (e.key === 'ArrowLeft') { dIdx--; renderDisplay(); scheduleRotate(); }
    if (e.key === 'f' || e.key === 'F') A.fs();
  }
});
document.addEventListener('focusin', e => { if (e.target.closest && e.target.closest('#modal') && e.target.type === 'number') e.target.select(); });
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = data.tournaments ? Object.values(data.tournaments) : (data.teams && data.phases ? [data] : null);
    if (!list || !list.length) throw new Error('format');
    let last = null;
    list.forEach(t => {
      if (db.tournaments[t.id]) { backup('Avant import', db.tournaments[t.id]); t.id = uid(); t.name += ' (import)'; }
      db.tournaments[t.id] = t; last = t;
    });
    db.currentId = last.id; ui.view = 't'; ui.tab = 'prep'; ui.cfg = 'general'; ui.res = null; ui.mf = { phase: 'all', court: 'all', status: 'all', q: '' }; closeModal(); invalidate(); persist(); render();
    toast(`${list.length} tournoi(s) importé(s).`);
  } catch (err) { toast('Fichier invalide : ce n\'est pas une sauvegarde Tournoi Manager.', 4000); }
});

/* ---------- écran public ---------- */
let dIdx = 0, dTimer = null;
function displayPanels(t) {
  const panels = [], S = t.schedule;
  const fr = finalRanking(t);
  if (fr && fr.complete) {
    const r = fr.rows, nm = i => r[i] ? esc(tname(r[i].id)) : '';
    panels.push({ title: 'Classement final', html: `<div class="d-final"><div class="podium">
      <div>${nm(1)}<div class="blk" style="height:60%">2</div></div><div>${nm(0)}<div class="blk" style="height:85%;background:#2b3b1a">1</div></div><div>${nm(2)}<div class="blk" style="height:42%">3</div></div></div>
      <div class="d-tables"><table>${r.map(x => `<tr><td class="rk">${x.rank != null ? ord(x.rank) : ''}</td><td class="l">${teamTag(x.id)}</td></tr>`).join('')}</table></div></div>` });
  }
  const todo = t.matches.filter(m => !m.done && m.time != null);
  if (todo.length) {
    const cards = S.courts.map((c, ci) => {
      const ms = todo.filter(m => m.court === ci).sort((a, b) => a.time - b.time);
      if (!ms.length) return `<div class="d-court"><h3>${esc(c)}</h3><div class="d-meta">Plus de match prévu</div></div>`;
      const live = ms.find(x => x.live);
      if (live) ms.splice(ms.indexOf(live), 1), ms.unshift(live);
      const m = ms[0];
      return `<div class="d-court ${m.live ? 'live' : ''}"><h3><span>${esc(c)}</span><span>${m.live ? '<span class="d-live">● EN COURS</span>' : fmtTime(m.time)}</span></h3>
        <div class="d-match"><div>${srcTag(m.a)}</div>${m.live && liveScoreHTML(t, m) ? `<span class="d-score">${liveScoreHTML(t, m)}</span>` : '<span class="vs">contre</span>'}<div>${srcTag(m.b)}</div></div>
        <div class="d-meta">M${m.num} · ${esc(matchLabel(t, m))}${m.referee ? ' · Arbitre : ' + esc(tname(m.referee)) : ''}</div>
        ${ms.slice(1, 3).map(n => `<div class="d-next">${fmtTime(n.time)} · ${srcTag(n.a)} – ${srcTag(n.b)}${n.referee ? ` <span style="color:#8fa0bb">(arb. ${esc(tname(n.referee))})</span>` : ''}</div>`).join('')}</div>`;
    }).join('');
    panels.push({ title: 'Sur les terrains', html: `<div class="d-courts">${cards}</div>` });
  }
  const done = t.matches.filter(m => m.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 10);
  if (done.length) panels.push({ title: 'Derniers résultats', html: `<div class="d-results">${done.map(m => {
    const d = sideData(t, m), sets = t.scoring.mode === 'sets', sv = s => m.forfeit ? (m.forfeit === s ? 'F' : '') : sets ? d[s].sw : d[s].sc;
    return `<div class="d-res"><div class="${winSide(m, 'a') ? 'win' : ''}">${esc(tname(teamOf(m.a)))} <b>${sv('a')}</b></div><span>–</span><div class="${winSide(m, 'b') ? 'win' : ''}"><b>${sv('b')}</b> ${esc(tname(teamOf(m.b)))}</div><small>${esc(matchLabel(t, m))}${sets && !m.forfeit ? ' · ' + m.sets.map(s => s.join('-')).join(' ') : ''}</small></div>`; }).join('')}</div>` });
  let cur = null; t.phases.forEach(p => { if (p.status !== 'draft') cur = p; });
  if (cur && cur.type === 'pools') {
    const per = cur.pools.length > 4 ? 6 : 4;
    for (let i = 0; i < cur.pools.length; i += per) {
      const chunk = cur.pools.slice(i, i + per).map((p, k) => [p, i + k]);
      panels.push({ title: `Classements · ${cur.name}`, html: `<div class="d-tables">${chunk.map(([p, pi]) => `<div><h3>${esc(p.name)}</h3><table><tr><th>Rg</th><th class="l">Équipe</th><th>Pts</th><th>J</th><th>G</th><th>P</th><th>Diff</th></tr>
        ${poolStandings(t, cur, pi).map(r => `<tr><td class="rk">${r.rank}</td><td class="l">${teamTag(r.id)}</td><td class="pts">${r.pts}</td><td>${r.j}</td><td>${r.w}</td><td>${r.l}</td><td>${t.scoring.mode === 'sets' ? (r.sw - r.sl > 0 ? '+' : '') + (r.sw - r.sl) : (r.sc - r.co > 0 ? '+' : '') + (r.sc - r.co)}</td></tr>`).join('')}</table></div>`).join('')}</div>` });
    }
  }
  if (cur && cur.type === 'bracket') cur.tableaux.forEach((tb, ti) => {
    if (phaseMatches(t, cur).some(m => m.tableau === ti)) panels.push({ title: `${cur.name} · ${tb.name}`, html: `<div class="d-bracket">${bracketCols(t, cur, ti)}</div>` });
  });
  if (!panels.length) panels.push({ title: 'Bienvenue', html: `<div class="d-empty"><div>${esc(t.name)}<br><span style="font-size:2.6vh">${t.teams.map(x => esc(x.name)).join(' · ')}</span></div></div>` });
  return panels;
}
function renderDisplay() {
  db = loadDb(); invalidate();
  document.body.classList.add('display');
  const t = T();
  if (!t) { app.innerHTML = '<div class="d-empty">Aucun tournoi ouvert dans l\'application.</div>'; return; }
  const ps = displayPanels(t), idx = ((dIdx % ps.length) + ps.length) % ps.length, p = ps[idx];
  const clock = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  app.innerHTML = `<div class="d-head"><div><div class="d-title">${esc(t.name)}</div><div class="d-sub">${esc(p.title)}</div></div>
    <div class="d-right"><span class="d-dots">${ps.map((_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('')}</span><span id="clock">${clock}</span>${document.fullscreenElement ? '' : '<button class="d-fs" data-act="fs" title="Plein écran (F)">⛶</button>'}</div></div>
    <div class="d-body">${p.html}</div>`;
  app.querySelectorAll('[data-act="openMatch"]').forEach(x => x.removeAttribute('data-act'));
}
function scheduleRotate() {
  clearTimeout(dTimer);
  const t = T(), s = Math.max(5, Number(t && t.display && t.display.rotate) || 15);
  dTimer = setTimeout(() => { dIdx++; renderDisplay(); scheduleRotate(); }, s * 1000);
}

/* ---------- démarrage ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (DISPLAY) {
  document.title = 'Écran public — Tournoi Manager';
  renderDisplay(); scheduleRotate();
  window.addEventListener('storage', e => { if (e.key === KEY) renderDisplay(); });
  if (bc) bc.onmessage = () => renderDisplay();
  setInterval(() => { const c = document.getElementById('clock'); if (c) c.textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }, 5000);
  document.addEventListener('fullscreenchange', renderDisplay);
} else {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (ui.view === 'home') render(); });
  window.addEventListener('appinstalled', () => { installPrompt = null; render(); });
  window.addEventListener('storage', e => { if (e.key === KEY && !document.getElementById('modal').innerHTML) { db = loadDb(); invalidate(); render(); } });
  render();
}
</script>
</body>
